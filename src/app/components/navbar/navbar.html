<nav class="navbar" [class.scrolled]="isScrolled() && !isContactSection()" [class.scrolled-light]="isContactSection()" [class.menu-open]="isMenuOpen()">
    <div class="logo">
         &lt;/&gt; Nicolas Kleiton
    </div>

    <ul class="nav-links" [class.active]="isMenuOpen()">
        @for (link of navLinks(); track link.path) {
          <li>
            <a href="javascript:void(0)"
               (click)="scrollToSection($event, link.path)"
               [class.active]="activeSection() === link.path">
               {{ link.label }}
            </a>
          </li>
        }
    </ul>

    <div class="nav-actions">
      <button class="lang-toggle" (click)="translationService.toggleLanguage()">
        <span [class.active]="translationService.language() === 'pt'">PT</span>
        <span class="separator">/</span>
        <span [class.active]="translationService.language() === 'en'">EN</span>
      </button>

      <button class="menu-toggle" [class.active]="isMenuOpen()" (click)="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
</nav>
