<nav class="navbar" [class.scrolled]="isScrolled && !isContactSection" [class.scrolled-light]="isContactSection">
    <div class="logo">
         &lt;/&gt; Nicolas Kleiton
    </div>

    <ul class="nav-links">
        <li *ngFor="let link of navLinks">
          <a href="javascript:void(0)" 
             (click)="scrollToSection($event, link.path)"
             [class.active]="activeSection === link.path">
             {{ link.label }}
          </a>
        </li>
    </ul>
    
    <div class="nav-actions">
      <button class="lang-toggle" (click)="translationService.toggleLanguage()">
        <span [class.active]="translationService.language() === 'pt'">PT</span>
        <span class="separator">/</span>
        <span [class.active]="translationService.language() === 'en'">EN</span>
      </button>
      
      <button class="menu-toggle" (click)="toggleMenu()">
        <span></span>
        <span></span>
      </button>
    </div>
</nav>
