<nav class="navbar" [class.scrolled]="isScrolled && !isContactSection" [class.scrolled-light]="isContactSection">
    <div class="logo">
         &lt;/&gt; Nicolas Kleiton
    </div>

    <ul class="nav-links">
        <li *ngFor="let link of navLinks">
          <a href="javascript:void(0)" 
             (click)="scrollToSection($event, link.path)"
             [class.active]="activeSection === link.path">
             {{ link.label }}
          </a>
        </li>
    </ul>
    
    <button class="menu-toggle" (click)="toggleMenu()">
      <span></span>
      <span></span>
    </button>
</nav>
