<section class="about-section" id="about">
  <div class="container">
    
    <div class="about-header-grid">
      <div class="about-intro">
        <span class="subtitle">{{ t.about.subtitle }}</span>
        <h2 class="main-title">{{ t.about.title }}</h2>
        <p class="bio" [innerHTML]="t.about.bio"></p>
      </div>

      <div class="about-image">
        <div class="image-wrapper">
          <img src="about/foto_about.png" alt="Nicolas Kleiton">
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <div class="extra-info">
      <div class="info-box" *ngFor="let edu of educationList">
        <h4>{{ edu.title }}</h4>
        <p class="highlight">{{ edu.highlight }}</p>
        <p class="subtext" *ngIf="edu.subtext">{{ edu.subtext }}</p>
      </div>
      
      <div class="info-box" *ngFor="let ach of achievementsList">
        <h4>{{ ach.title }}</h4>
        <p class="highlight">{{ ach.highlight }}</p>
      </div>
    </div>

    <div class="skills-section">
      <div class="skills-header">
        <h4>{{ t.about.techStack }}</h4>
        <div class="filter-menu">
          <button [class.active]="activeFilter === 'all'" (click)="setFilter('all')">{{ t.about.filterAll }}</button>
          <button [class.active]="activeFilter === 'frontend'" (click)="setFilter('frontend')">{{ t.about.filterFrontend }}</button>
          <button [class.active]="activeFilter === 'backend'" (click)="setFilter('backend')">{{ t.about.filterBackend }}</button>
          <button [class.active]="activeFilter === 'tools'" (click)="setFilter('tools')">{{ t.about.filterTools }}</button>
        </div>
      </div>

      <div class="skills-grid">
        <div class="skill-category wide" *ngFor="let skill of filteredSkills">
          <span class="cat-name">{{ skill.category }} —</span>
          <p>{{ skill.items }}</p>
        </div>
      </div>
    </div>

    <div class="about-footer">
      <div class="divider sutil"></div>
      <div class="footer-content">
        <a href="https://drive.google.com/file/d/19nJmbPMCTywzhAf0zoBKf4EP5yvak9bG/view?usp=sharing" target="_blank" rel="noopener noreferrer" class="btn-cv">
          {{ t.about.downloadCv }} <span class="arrow">↓</span>
        </a>
        <div class="mini-social">
          <a href="https://github.com/Nicolas-Kleiton" target="_blank">{{ t.about.github }}</a>
          <a href="https://linkedin.com/in/nicolaskleiton" target="_blank">{{ t.about.linkedin }}</a>
        </div>
      </div>
    </div>

    <div class="section-divider" #divider [ngClass]="{'animate-reveal': isRevealed, 'animate-idle': isIdle}">
      <div class="line"></div>
      <div class="dot"></div>
    </div>

  </div>
</section>
