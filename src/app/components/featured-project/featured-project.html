<section class="projects-section" id="projects">
  <div class="container">
    
    <div class="section-header">
      <span class="subtitle">PORTFOLIO</span>
      <h2 class="main-title">Featured Projects</h2>
    </div>

    <div class="project-group">
      <h3 class="group-title">Enterprise Solutions <span class="lock-icon">🔒</span></h3>
      <div class="projects-grid enterprise">
        <div class="project-card abstract" *ngFor="let project of enterpriseProjects">
          <div class="card-icon">
            <i class="tech-icon">{{ project.iconText }}</i>
          </div>
          <div class="card-content">
            <span class="project-date">{{ project.date }}</span>
            <h4>{{ project.title }}</h4>
            <p [innerHTML]="project.description"></p>
            <div class="tags">
              <span *ngFor="let tag of project.tags">{{ tag }}</span>
            </div>
          </div>
        </div>

      </div>
    </div>

    <div class="project-group">
      <h3 class="group-title">Personal Projects <span class="lock-icon">⚡</span></h3>
      <div class="projects-grid">
        <div class="project-card" *ngFor="let project of personalProjects">
          <div class="img-wrapper">
            <img [src]="project.imageUrl" alt="{{ project.title }} Preview" class="card-img">
            <div class="award-badge" *ngIf="project.award">{{ project.award }}</div>
          </div>
          <div class="card-content">
            <span class="project-date">{{ project.date }}</span>
            <h4>{{ project.title }}</h4>
            <p>{{ project.description }}</p>
            <div class="tags">
              <span *ngFor="let tag of project.tags">{{ tag }}</span>
            </div>
            <a [href]="project.githubLink" target="_blank" class="view-project">
              VIEW REPOSITORY <span class="arrow">→</span>
            </a>
          </div>
        </div>

      </div>
    </div>
  </div>
</section>
