<section class="contact-section" id="contact">
  <div class="container">
    <div class="contact-header">
      <span class="subtitle">{{ t.contact.subtitle }}</span>
      <h2 class="main-title">{{ t.contact.title }}</h2>
      <p class="description">
        {{ t.contact.description }}
      </p>
    </div>
    
    <div class="contact-action">
      <a href="mailto:inicolaskleiton@gmail.com" class="btn-email">{{ t.contact.sayHello }}</a>
    </div>

    <div class="contact-footer">
      <div class="social-links">
        <a href="https://github.com/Nicolas-Kleiton" target="_blank">GitHub</a>
        <a href="https://linkedin.com/in/nicolaskleiton" target="_blank">LinkedIn</a>
        <a href="https://drive.google.com/file/d/19nJmbPMCTywzhAf0zoBKf4EP5yvak9bG/view?usp=sharing" target="_blank" rel="noopener noreferrer">{{ t.contact.resume }}</a>
      </div>
      <p class="copyright">{{ t.contact.copyright }}</p>
    </div>
  </div>
</section>
